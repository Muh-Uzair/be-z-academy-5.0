services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: z-academy-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  redis:
    image: redis/redis-stack:latest
    container_name: z-academy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"   # Redis database port
      - "8001:8001"   # RedisInsight GUI port
    volumes:
      - redis_data:/data

volumes:
  redis_data:

