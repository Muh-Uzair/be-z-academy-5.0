services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: z-academy-50-image
    container_name: z-academy-50-container
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis/redis-stack:latest
    container_name: z-academy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"   # Redis database port
      - "8001:8001"   # RedisInsight GUI port
    volumes:
      - redis_data:/data

volumes:
  redis_data:

